<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Demo - Electronics Showroom</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <div class="container mt-5">
        <h1 class="text-center mb-4">Book a Product Demonstration</h1>
        <form class="row g-3">
            <div class="col-md-6">
                <label for="inputName" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="inputName" required>
            </div>
            <div class="col-md-6">
                <label for="inputPhone" class="form-label">Phone Number</label>
                <input type="tel" class="form-control" id="inputPhone" required>
            </div>
            <div class="col-12">
                <label for="inputProduct" class="form-label">Product of Interest</label>
                <input type="text" class="form-control" id="inputProduct" placeholder="e.g., Samsung 55-inch QLED TV">
            </div>
            <div class="col-md-6">
                <label for="inputDate" class="form-label">Preferred Date</label>
                <input type="date" class="form-control" id="inputDate" required>
            </div>
            <div class="col-md-6">
                <label for="inputTime" class="form-label">Preferred Time</label>
                <input type="time" class="form-control" id="inputTime" required>
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-primary">Request Demo</button>
            </div>
        </form>
    </div>

    <div id="footer-placeholder"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts.js"></script>
</body>
</html>
