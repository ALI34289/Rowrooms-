<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Electronics Showroom</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <div class="container mt-5">
        <h1 class="text-center mb-4">Gallery</h1>
        <div class="row">
            <div class="col-lg-4 col-md-6 mb-4">
                <img src="https://via.placeholder.com/400x300?text=Showroom+View" class="img-fluid rounded" alt="Gallery Image">
            </div>
            <div class="col-lg-4 col-md-6 mb-4">
                <img src="https://via.placeholder.com/400x300?text=Product+Display" class="img-fluid rounded" alt="Gallery Image">
            </div>
            <div class="col-lg-4 col-md-6 mb-4">
                <img src="https://via.placeholder.com/400x300?text=Customer+Interaction" class="img-fluid rounded" alt="Gallery Image">
            </div>
            <!-- Add more images as needed -->
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts.js"></script>
</body>
</html>
