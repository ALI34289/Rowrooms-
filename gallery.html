<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Electronics Showroom</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <div class="container mt-5">
        <div class="text-center mb-5">
            <h1 class="display-5 fw-bold">Our Gallery</h1>
            <p class="lead text-muted">A glimpse into our showroom and our happy customers.</p>
        </div>

        <!-- Showroom Interior/Exterior -->
        <h2 class="mb-4">Showroom Tour</h2>
        <div class="row g-4">
            <div class="col-md-6"><img src="https://via.placeholder.com/600x400?text=Showroom+Exterior" class="img-fluid rounded shadow-sm" alt="Showroom Exterior"></div>
            <div class="col-md-6"><img src="https://via.placeholder.com/600x400?text=Showroom+Interior" class="img-fluid rounded shadow-sm" alt="Showroom Interior"></div>
        </div>

        <!-- Product Displays -->
        <h2 class="my-5">Product Displays</h2>
        <div class="row g-4">
            <div class="col-lg-4 col-md-6"><img src="https://via.placeholder.com/400x300?text=TV+Section" class="img-fluid rounded shadow-sm" alt="TV Display Section"></div>
            <div class="col-lg-4 col-md-6"><img src="https://via.placeholder.com/400x300?text=Appliance+Section" class="img-fluid rounded shadow-sm" alt="Home Appliances Section"></div>
            <div class="col-lg-4 col-md-6"><img src="https://via.placeholder.com/400x300?text=Audio+Section" class="img-fluid rounded shadow-sm" alt="Audio Systems Display"></div>
        </div>

        <!-- Happy Customers -->
        <h2 class="my-5">Our Happy Customers</h2>
        <div class="row g-4">
            <div class="col-lg-3 col-md-6"><img src="https://via.placeholder.com/400x400?text=Customer+1" class="img-fluid rounded shadow-sm" alt="Happy Customer 1"></div>
            <div class="col-lg-3 col-md-6"><img src="https://via.placeholder.com/400x400?text=Customer+2" class="img-fluid rounded shadow-sm" alt="Happy Customer 2"></div>
            <div class="col-lg-3 col-md-6"><img src="https://via.placeholder.com/400x400?text=Customer+3" class="img-fluid rounded shadow-sm" alt="Happy Customer 3"></div>
            <div class="col-lg-3 col-md-6"><img src="https://via.placeholder.com/400x400?text=Customer+4" class="img-fluid rounded shadow-sm" alt="Happy Customer 4"></div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts.js"></script>
</body>
</html>
