<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book an Appointment - Electronics Showroom</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <div class="container mt-5">
        <h1 class="text-center mb-4">Book an Appointment</h1>
        <p class="text-center text-muted">Select a service, date, and time that works for you.</p>

        <div class="row">
            <div class="col-md-8 offset-md-2">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Select Service</h5>
                        <select class="form-select mb-3">
                            <option selected>Choose a service...</option>
                            <option value="instore">In-Store Visit</option>
                            <option value="demo">Product Demo</option>
                            <option value="installation">Home Installation</option>
                        </select>

                        <h5 class="card-title">Select Date & Time</h5>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <input type="date" class="form-control">
                            </div>
                            <div class="col-md-6 mb-3">
                                <input type="time" class="form-control">
                            </div>
                        </div>

                        <button class="btn btn-primary w-100">Confirm Appointment</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts.js"></script>
</body>
</html>
