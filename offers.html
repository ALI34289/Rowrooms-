<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offers - Electronics Showroom</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <div class="container mt-5">
        <h1 class="text-center mb-4">Current Offers</h1>
        <div class="row">
            <!-- Offer 1 -->
            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">20% Off on All TVs</h5>
                        <p class="card-text">Get a flat 20% discount on all television models. Offer valid for a limited time.</p>
                        <a href="#" class="btn btn-primary">Claim Offer</a>
                    </div>
                </div>
            </div>
            <!-- Offer 2 -->
            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">No-Cost EMI on Refrigerators</h5>
                        <p class="card-text">Purchase any refrigerator with our no-cost EMI plan for up to 12 months.</p>
                        <a href="#" class="btn btn-primary">Learn More</a>
                    </div>
                </div>
            </div>
            <!-- Add more offers as needed -->
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts.js"></script>
</body>
</html>
