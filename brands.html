<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brands - Electronics Showroom</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <div class="container mt-5">
        <h1 class="text-center mb-4">Our Brands</h1>
        <p class="text-center text-muted">We partner with the leading brands in the electronics industry to bring you the best products.</p>
        <div class="row text-center mt-5">
            <div class="col-md-3 col-sm-6 mb-4">
                <img src="https://via.placeholder.com/150x80?text=LG" class="img-fluid" alt="LG">
            </div>
            <div class="col-md-3 col-sm-6 mb-4">
                <img src="https://via.placeholder.com/150x80?text=Samsung" class="img-fluid" alt="Samsung">
            </div>
            <div class="col-md-3 col-sm-6 mb-4">
                <img src="https://via.placeholder.com/150x80?text=Sony" class="img-fluid" alt="Sony">
            </div>
            <div class="col-md-3 col-sm-6 mb-4">
                <img src="https://via.placeholder.com/150x80?text=Bosch" class="img-fluid" alt="Bosch">
            </div>
            <!-- Add more brands as needed -->
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts.js"></script>
</body>
</html>
