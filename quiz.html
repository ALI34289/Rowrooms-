<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Your Perfect Product - Electronics Showroom</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <div class="container mt-5">
        <h1 class="text-center mb-4">Find Your Perfect Match</h1>
        <div id="quiz-container">
            <!-- Quiz questions will be injected here by JavaScript -->
        </div>
        <div id="quiz-result" class="text-center" style="display: none;">
            <h2>We recommend:</h2>
            <p id="recommendation"></p>
        </div>
    </div>

    <div id="footer-placeholder"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts.js"></script>
    <script>
        const quizContainer = document.getElementById('quiz-container');
        const quizResult = document.getElementById('quiz-result');
        const recommendation = document.getElementById('recommendation');

        const questions = [
            {
                question: "What's your budget?",
                answers: { a: "Under $500", b: "$500 - $1000", c: "Over $1000" },
                recommendation: { a: "a basic TV", b: "a mid-range laptop", c: "a high-end smartphone" }
            },
            {
                question: "What's your primary use?",
                answers: { a: "Entertainment", b: "Work", c: "Gaming" },
                recommendation: { a: "a large screen TV", b: "a powerful laptop", c: "a gaming console" }
            },
            {
                question: "What's your preferred brand?",
                answers: { a: "Samsung", b: "LG", c: "Sony" },
                recommendation: { a: "a Samsung product", b: "an LG product", c: "a Sony product" }
            }
        ];

        let currentQuestion = 0;
        let userAnswers = {};

        function showQuestion() {
            const q = questions[currentQuestion];
            let answersHtml = '';
            for (const key in q.answers) {
                answersHtml += `<button class="btn btn-outline-primary m-2" onclick="handleAnswer('${key}')">${q.answers[key]}</button>`;
            }
            quizContainer.innerHTML = `<h2>${q.question}</h2><div class="mt-3">${answersHtml}</div>`;
        }

        function handleAnswer(answer) {
            userAnswers[currentQuestion] = answer;
            currentQuestion++;
            if (currentQuestion < questions.length) {
                showQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            quizContainer.style.display = 'none';
            quizResult.style.display = 'block';
            // This is a very basic recommendation engine. A real one would be more complex.
            recommendation.innerText = `Based on your answers, we recommend ${questions[0].recommendation[userAnswers[0]]}, specifically ${questions[2].recommendation[userAnswers[2]]} for ${userAnswers[1] === 'a' ? 'entertainment' : (userAnswers[1] === 'b' ? 'work' : 'gaming')}.`;
        }

        showQuestion();
    </script>
</body>
</html>
