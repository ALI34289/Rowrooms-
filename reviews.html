<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Reviews - Electronics Showroom</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <div class="container mt-5">
        <h1 class="text-center mb-4">Customer Reviews</h1>
        <div class="row">
            <!-- Review 1 -->
            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-body">
                        <p class="card-text">"Excellent service and a great selection of products. The staff was very helpful."</p>
                        <footer class="blockquote-footer">John Doe</footer>
                    </div>
                </div>
            </div>
            <!-- Review 2 -->
            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-body">
                        <p class="card-text">"I found the perfect TV for my living room at a very competitive price. Highly recommended."</p>
                        <footer class="blockquote-footer">Jane Smith</footer>
                    </div>
                </div>
            </div>
            <!-- Add more reviews as needed -->
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts.js"></script>
</body>
</html>
